name: Android CI and Signed Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airtype-${{ github.workflow }}-${{ github.ref }}
  # Releases must never be cancelled halfway: a cancelled run wastes an artifact set
  # and can leave a version half-published. Queue instead of cancelling.
  cancel-in-progress: false

env:
  BASE_VERSION: '1.0.2'

jobs:
  plan:
    name: Plan next release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version_name: ${{ steps.plan.outputs.version_name }}
      version_code: ${{ steps.plan.outputs.version_code }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Checkout source and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute release decision and version
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_VALUE: ${{ github.ref }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          python3 - <<'PY'
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          base = tuple(int(part) for part in os.environ["BASE_VERSION"].split("."))
          stable = re.compile(r"^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$")
          head_sha = git("rev-parse", "HEAD")

          versions = [base]
          tags_at_head = []
          for tag in git("tag", "--list").splitlines():
              match = stable.fullmatch(tag)
              if not match:
                  continue
              versions.append(tuple(int(part) for part in match.groups()))
              if git("rev-list", "-n", "1", tag) == head_sha:
                  tags_at_head.append(tag)

          event = os.environ["EVENT_NAME"]
          ref = os.environ["REF_VALUE"]
          release_branch = ref == "refs/heads/main"
          already_released = bool(tags_at_head)
          # Root rule: a push to main is enough to publish. Nothing here requires a
          # manual "Run workflow". Pull requests and other refs build and test only.
          should_release = event in ("push", "workflow_dispatch") and release_branch and not already_released

          if event == "pull_request":
              reason = "pull request: tests only"
          elif not release_branch:
              reason = f"ref {ref} is not refs/heads/main"
          elif already_released:
              reason = f"commit {head_sha[:7]} already released as {tags_at_head[0]}"
          elif event == "workflow_dispatch":
              reason = "manual run on main"
          else:
              reason = "automatic release for push to main"

          # Optional explicit bump marker in the pushed commit message.
          message = git("log", "-1", "--pretty=%B")
          level = "patch"
          if "[release:major]" in message:
              level = "major"
          elif "[release:minor]" in message:
              level = "minor"

          major, minor, patch = max(versions)
          if should_release:
              if level == "major":
                  major, minor, patch = major + 1, 0, 0
              elif level == "minor":
                  major, minor, patch = major, minor + 1, 0
              else:
                  patch += 1

          if minor >= 1000 or patch >= 1000:
              raise SystemExit("SemVer minor/patch must stay below 1000 for the versionCode scheme")

          version_name = f"{major}.{minor}.{patch}"
          # Deterministic mapping: every SemVer value has exactly one versionCode, it
          # only grows when the version grows, and it does not consume GitHub run
          # numbers. 1.0.4 -> 1000004, which is above the previously published 16.
          version_code = major * 1_000_000 + minor * 1_000 + patch
          if version_code > 2_100_000_000:
              raise SystemExit("versionCode exceeds Android's supported maximum")

          outputs = {
              "should_release": "true" if should_release else "false",
              "version_name": version_name,
              "version_code": str(version_code),
              "release_tag": f"v{version_name}",
              "artifact_name": f"AirType-release-v{version_name}-code{version_code}",
              "reason": reason,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={value}\n")

          print(f"decision: should_release={outputs['should_release']} ({reason})")
          print(f"plan: tag={outputs['release_tag']} versionCode={version_code} bump={level}")
          PY

  verify:
    name: Unit tests and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AirType-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed_release:
    name: Build and sign release APK and AAB
    needs: [ plan, verify ]
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: android-release
    permissions:
      contents: read
    outputs:
      version_name: ${{ needs.plan.outputs.version_name }}
      version_code: ${{ needs.plan.outputs.version_code }}
      release_tag: ${{ needs.plan.outputs.release_tag }}
      artifact_name: ${{ needs.plan.outputs.artifact_name }}
    steps:
      - name: Checkout source and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Materialize and validate protected signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 in android-release environment}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD in android-release environment}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS in android-release environment}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/airtype-release.jks"
          test -s "$RUNNER_TEMP/airtype-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/airtype-release.jks" \
            -storetype JKS -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed release APK and Play bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/airtype-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AIRTYPE_VERSION_NAME: ${{ needs.plan.outputs.version_name }}
          AIRTYPE_VERSION_CODE: ${{ needs.plan.outputs.version_code }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD in android-release environment}"
          gradle --no-daemon --stacktrace clean :app:assembleRelease :app:bundleRelease \
            -PappVersionName="$AIRTYPE_VERSION_NAME" \
            -PappVersionCode="$AIRTYPE_VERSION_CODE"

      - name: Verify signatures and prepare release files
        env:
          AIRTYPE_VERSION_NAME: ${{ needs.plan.outputs.version_name }}
          AIRTYPE_VERSION_CODE: ${{ needs.plan.outputs.version_code }}
          AIRTYPE_RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          AIRTYPE_TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" \
            > "$RUNNER_TEMP/apk-signature-check.txt"
          bundle_verification="$(jarsigner -verify "$aab" 2>&1)"
          if [[ "${bundle_verification,,}" != *"jar verified"* ]]; then
            printf '%s\n' "$bundle_verification" >&2
            echo "AAB signature verification did not report a verified archive." >&2
            exit 1
          fi

          mkdir -p dist
          cp "$apk" "dist/AirType-${AIRTYPE_RELEASE_TAG}.apk"
          cp "$aab" "dist/AirType-${AIRTYPE_RELEASE_TAG}.aab"
          {
            printf 'version=%s\n' "$AIRTYPE_RELEASE_TAG"
            printf 'versionName=%s\n' "$AIRTYPE_VERSION_NAME"
            printf 'versionCode=%s\n' "$AIRTYPE_VERSION_CODE"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'trigger=%s\n' "$AIRTYPE_TRIGGER"
            printf 'workflowRun=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > dist/BUILD-INFO.txt
          (
            cd dist
            sha256sum "AirType-${AIRTYPE_RELEASE_TAG}.apk" "AirType-${AIRTYPE_RELEASE_TAG}.aab" BUILD-INFO.txt > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload signed release outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/airtype-release.jks" "$RUNNER_TEMP/apk-signature-check.txt"

  publish_release:
    name: Publish GitHub Release
    needs: [ plan, signed_release ]
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout source and tags for the changelog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download this run's signed release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: release

      - name: Verify release file checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS
          test -s "AirType-${{ needs.plan.outputs.release_tag }}.apk"
          test -s "AirType-${{ needs.plan.outputs.release_tag }}.aab"

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          RELEASE_VERSION_NAME: ${{ needs.plan.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ needs.plan.outputs.version_code }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; nothing to publish."
            exit 0
          fi

          previous_tag="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$RELEASE_TAG" | head -n 1 || true)"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "إصدار AirType للأندرويد — يُبنى ويُوقّع ويُنشر تلقائيًا عند الدفع إلى \`main\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| الإصدار | \`$RELEASE_TAG\` |"
            echo "| versionName | \`$RELEASE_VERSION_NAME\` |"
            echo "| versionCode | \`$RELEASE_VERSION_CODE\` |"
            echo "| التزام المصدر | \`$GITHUB_SHA\` |"
            echo "| للتثبيت المباشر | \`AirType-$RELEASE_TAG.apk\` |"
            echo "| Google Play | \`AirType-$RELEASE_TAG.aab\` |"
            echo
            echo "مرفق أيضًا \`SHA256SUMS\` للتحقق و\`BUILD-INFO.txt\` ببيانات البناء."
            echo
            if [[ -n "$previous_tag" ]]; then
              echo "### التغييرات منذ $previous_tag"
              echo
              git log --no-merges -n 60 --pretty='- %s (`%h`)' "$previous_tag..$GITHUB_SHA"
            else
              echo "### التغييرات"
              echo
              git log --no-merges -n 60 --pretty='- %s (`%h`)' "$GITHUB_SHA"
            fi
          } > "$notes"

          gh release create "$RELEASE_TAG" \
            "release/AirType-${RELEASE_TAG}.apk" \
            "release/AirType-${RELEASE_TAG}.aab" \
            release/SHA256SUMS release/BUILD-INFO.txt \
            --target "$GITHUB_SHA" \
            --title "AirType $RELEASE_TAG" \
            --notes-file "$notes" \
            --repo "$GITHUB_REPOSITORY"

      - name: Confirm the published release is complete
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          RELEASE_VERSION_CODE: ${{ needs.plan.outputs.version_code }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          if [[ "$assets" -lt 4 ]]; then
            echo "Release $RELEASE_TAG is missing assets (expected 4, found $assets)." >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,url,assets --jq '{tag: .tagName, url: .url, assets: [.assets[].name]}'
          echo "Published $RELEASE_TAG with versionCode $RELEASE_VERSION_CODE and $assets assets."
